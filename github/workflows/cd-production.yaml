
name: wf-production-deploy
on: 
  push:
    branches:
      - production
jobs:
  build-production-job:
    runs-on: ubuntu-latest
    steps:
      - name: Chekcout Repo
        uses: actions/checkout@v4 
        with:
          ref: ${{github.ref}}
      - name: Build Website With Parcel 
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dev" --public-url "./"
      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dev"
          name: "build-artifact-production"
  deploy-production-job:
    needs: "build-production-job"
    environment: "production-env"
    permissions:
      pages: write
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Artifacts on GH Pages 
        uses: actions/deploy-pages@v4 
        with: 
          artifact_name: "build-artifact-production"
          token: ${{github.token}}